name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Verify @novelbits/ble-spec generated files match YAML
        run: npm run gen:ble-spec:check

      - run: npm test

      - name: Install Python test dependencies
        run: python3 -m pip install pytest pylink-square

      - name: Run Python tests
        run: python3 -m pytest test/python -v

      - name: Verify config-key parity (package.json declarations vs runtime reads)
        run: node scripts/check-runtime-config-keys.mjs
