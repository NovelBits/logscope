sonar.projectKey=NovelBits_logscope
sonar.organization=novelbits

# NOTE: This project uses SonarCloud Automatic Analysis, which IGNORES this
# file entirely. The settings below are documentation of intent — actual
# exclusions are configured at the project level via SonarCloud's API/UI.
# If you ever switch to CI-Based Analysis (by adding a SonarCloud GitHub
# Action step + SONAR_TOKEN secret + disabling Automatic Analysis), THIS
# file becomes load-bearing.

# Source/test layout
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.py

# Copy-Paste Detector (duplication) exclusions:
# Test files are inherently repetitive — each test case exercises a similar
# pattern (arrange/act/assert), and that's a feature, not a bug. Reporting
# duplication on tests punishes the testing discipline. Excluding them here
# follows the SonarCloud default for most TS projects.
sonar.cpd.exclusions=test/**,**/*.test.ts,**/*.test.tsx,**/*.test.py,packages/ble-spec/src/generated/**

# Exclude prebuilt firmware binaries and machine-generated files from analysis.
# Prebuilt binaries are committed for convenience (one-line flash command) but
# are not source code. The packages/ble-spec/src/generated/ TS modules are
# regenerated from YAML by scripts/generate-wrappers.ts; CI verifies they match
# the YAML, so hand-analyzing them is noise (every entry looks the same by
# design).
sonar.exclusions=samples/prebuilt/**,**/build/**,**/build-*/**,packages/ble-spec/src/generated/**

# Coverage report (lcov from jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
