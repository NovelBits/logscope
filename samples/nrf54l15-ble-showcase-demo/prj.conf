# LogScope BLE Showcase: Scanner Demo - nRF54L15 DK
# Active-scans for nearby BLE devices. Every received Advertising Report
# flows through HCI to LogScope where the new BLE decoders kick in:
#   - Manufacturer Specific Data: Company ID resolved to vendor name
#     (Apple, Inc., Samsung Electronics Co. Ltd., Bose Corporation,
#     Nordic Semiconductor ASA, etc.) instead of just a hex value.
#   - Every HCI Command Complete carries a Status field annotated with
#     the Bluetooth Core Spec section reference.
#   - AD types parsed into named fields (Flags, Local Name, Service
#     UUIDs, Tx Power, etc.) by the existing AD decoder.
#
# Run this in a typical office/home and you'll see the surrounding
# Bluetooth LE traffic as you've never seen it before — every device
# named, every spec citation inline.
#
# Build:
#   source samples/nrf54l15-uart-demo/setup-env.sh && \
#     west build -b nrf54l15dk/nrf54l15/cpuapp samples/nrf54l15-ble-showcase-demo \
#       --build-dir build-showcase -p

# Logging via RTT (channel 0 for Zephyr logs)
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Bluetooth: observer (scanner) role
CONFIG_BT=y
CONFIG_BT_OBSERVER=y

# HCI monitor over RTT channel 1 (btmonitor); LogScope captures and decodes
CONFIG_BT_DEBUG_MONITOR_RTT=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048
