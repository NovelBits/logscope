# UART overlay for boards without J-Link (e.g., STM32 Nucleo with ST-Link)
# Build with: west build -b <board> samples/zephyr-generic-demo -- -DEXTRA_CONF_FILE=uart.conf

# Disable RTT
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=0

# Enable UART logging
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
