# LogScope Silent Demo — nRF54L15 DK
# Test fixture for the RTT silence-recovery path: prints two lines at boot,
# then goes silent forever. Used to reproduce issue #17 deterministically.
# Build: source samples/nrf54l15-uart-demo/setup-env.sh && \
#        west build -b nrf54l15dk/nrf54l15/cpuapp samples/nrf54l15-silent-demo --build-dir build-silent -p

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_MAIN_STACK_SIZE=2048
